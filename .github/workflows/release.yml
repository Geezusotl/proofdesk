name: release
# Builds downloadable apps (no Python needed) when you push a tag like v0.2.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows, sep: ';'}
          - {os: macos-latest, name: Mac, sep: ':'}
          - {os: ubuntu-latest, name: Linux, sep: ':'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packager
        run: python -m pip install pyinstaller
      - name: Build the app
        shell: bash
        run: |
          pyinstaller --onefile --name ProofDesk --paths src \
            --add-data "src/proofdesk/sample${{ matrix.sep }}proofdesk/sample" \
            --add-data "src/proofdesk/ui${{ matrix.sep }}proofdesk/ui" \
            --distpath dist packaging/launcher.py
      - name: Check 1 - app starts
        shell: bash
        run: ./dist/ProofDesk --version
      - name: Check 2 - app finds its bundled sample documents
        shell: bash
        run: ./dist/ProofDesk ask "What is the company mascot?" > ask.txt 2>&1 || { cat ask.txt; exit 1; }
      - name: Check 3 - answer is right
        shell: bash
        run: cat ask.txt; grep -i "purple otter" ask.txt
      - name: Zip it
        shell: bash
        run: |
          mkdir out
          cp dist/ProofDesk* out/
          cp docs/INSTALL.md out/READ-ME-FIRST.md
          cd out && python -c "import shutil; shutil.make_archive('../ProofDesk-${{ matrix.name }}', 'zip', '.')"
      - uses: actions/upload-artifact@v4
        with:
          name: ProofDesk-${{ matrix.name }}
          path: ProofDesk-${{ matrix.name }}.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ProofDesk-${{ matrix.name }}.zip
          generate_release_notes: true
