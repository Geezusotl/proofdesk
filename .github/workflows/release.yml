name: release
# Builds downloadable apps (no Python needed) when you push a tag like v0.2.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: Mac}
          - {os: ubuntu-latest, name: Linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packager
        run: python -m pip install pyinstaller
      - name: Build the app
        shell: bash
        run: |
          pyinstaller --onefile --name ProofDesk --paths src --collect-data proofdesk \
            --distpath dist packaging/launcher.py
      - name: Check the built app works
        shell: bash
        run: |
          ./dist/ProofDesk --version
          ./dist/ProofDesk ask "What is the company mascot?" | grep -i "purple otter"
      - name: Zip it
        shell: bash
        run: |
          mkdir out
          cp dist/ProofDesk* out/
          cp docs/INSTALL.md out/READ-ME-FIRST.md
          cd out && python -c "import shutil; shutil.make_archive('../ProofDesk-${{ matrix.name }}', 'zip', '.')"
      - uses: actions/upload-artifact@v4
        with:
          name: ProofDesk-${{ matrix.name }}
          path: ProofDesk-${{ matrix.name }}.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ProofDesk-${{ matrix.name }}.zip
          generate_release_notes: true
